<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Utrymningstimer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<style>
/* Layout: en smal kolumn – status, stor klocka, fem knappar i tryckordning, export och nollställ längst ned. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --fg: #111821;
  --muted: #5b6676;
  --line: #d6dce4;
  --green: #17803f;
  --green-tint: #dcefe3;
  --blue: #1b58b8;
  --blue-tint: #dde7f6;
  --red: #c0262b;
  --red-tint: #f6dfe0;
  --slate: #4a5a72;
  --slate-tint: #e1e6ee;
  --on-color: #ffffff;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e13; --surface: #141a22; --fg: #eef2f7; --muted: #97a2b2; --line: #263040;
    --green: #2a9d57; --green-tint: #15301f; --blue: #3a76d6; --blue-tint: #172840;
    --red: #d6393e; --red-tint: #3a1719; --slate: #5d6f8c; --slate-tint: #1d2532; --on-color: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e13; --surface: #141a22; --fg: #eef2f7; --muted: #97a2b2; --line: #263040;
  --green: #2a9d57; --green-tint: #15301f; --blue: #3a76d6; --blue-tint: #172840;
  --red: #d6393e; --red-tint: #3a1719; --slate: #5d6f8c; --slate-tint: #1d2532; --on-color: #ffffff;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; touch-action: manipulation; }

.app {
  max-width: 520px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--surface);
  color: var(--muted);
  border: 1px solid var(--line);
}
.pill::before {
  content: "";
  width: 8px; height: 8px; border-radius: 50%;
  background: currentColor;
}
.pill.running { color: var(--green); border-color: var(--green); }
.pill.ended { color: var(--red); border-color: var(--red); }
@media (prefers-reduced-motion: no-preference) {
  .pill.running::before { animation: blink 1s steps(2, start) infinite; }
}
@keyframes blink { to { visibility: hidden; } }
.date { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

.clock {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px 12px 16px;
  text-align: center;
}
.clock-time {
  font-family: var(--font-display);
  font-size: clamp(54px, 19vw, 104px);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.clock-time.long { font-size: clamp(44px, 15vw, 88px); }
.clock-cap {
  margin-top: 8px;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.buttons { display: flex; flex-direction: column; gap: 10px; }
.btn {
  --c: var(--blue);
  --t: var(--blue-tint);
  width: 100%;
  min-height: 76px;
  border: 2px solid var(--c);
  border-radius: 16px;
  background: var(--c);
  color: var(--on-color);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
  cursor: pointer;
  transition: transform 80ms ease, opacity 150ms ease;
}
.btn.green { --c: var(--green); --t: var(--green-tint); }
.btn.red { --c: var(--red); --t: var(--red-tint); }
.btn.other { --c: var(--slate); --t: var(--slate-tint); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair .btn { flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; padding: 12px 14px; }
.pair .btn .lbl { font-size: 18px; }
.pair .btn .sub { text-align: left; }
.pair .btn .sub .el { font-size: 17px; }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.btn:disabled { opacity: 0.3; filter: saturate(0.25); cursor: default; }
.btn.done:disabled { opacity: 1; filter: none; background: var(--t); color: var(--fg); }
.btn .lbl { font-size: 21px; font-weight: 700; line-height: 1.15; }
.btn .sub {
  font-size: 15px;
  font-weight: 600;
  text-align: right;
  font-variant-numeric: tabular-nums;
  line-height: 1.3;
  white-space: nowrap;
}
.btn .sub .el { display: block; font-size: 19px; }
.btn .sub .tod { display: block; color: var(--muted); font-weight: 500; }
.btn:not(.done) .sub { opacity: 0.85; font-weight: 500; }
.btn.done .lbl::before { content: "✓ "; color: var(--c); }

.export-wrap { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.btn.export {
  --c: var(--fg);
  background: transparent;
  color: var(--fg);
  border-color: var(--line);
  border-width: 2px;
  min-height: 68px;
  justify-content: center;
  text-align: center;
  font-size: 19px;
  font-weight: 700;
}
.btn.export:not(:disabled) { border-color: var(--fg); }

.textbtn {
  align-self: center;
  background: none;
  border: 0;
  color: var(--blue);
  font-size: 16px;
  font-weight: 600;
  padding: 12px 16px;
  min-height: 44px;
  cursor: pointer;
}
.textbtn:disabled { color: var(--muted); opacity: 0.5; cursor: default; }
.textbtn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 8px; }
.textbtn.ok { color: var(--green); }

.note { margin: 0; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.45; }
.fallback {
  width: 100%;
  min-height: 190px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--fg);
  padding: 12px;
  font: 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  -webkit-user-select: text;
  user-select: text;
  resize: vertical;
}

.reset-wrap { display: flex; justify-content: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.textbtn.reset { color: var(--muted); font-weight: 500; font-size: 15px; }
.textbtn.reset.armed { color: var(--red); font-weight: 700; }
</style>
</head>
<body>

<main class="app">
  <div class="top">
    <span id="status" class="pill">Redo</span>
    <span id="date" class="date"></span>
  </div>

  <div class="clock">
    <div id="time" class="clock-time">00:00.00</div>
    <div id="cap" class="clock-cap">Tid sedan larm</div>
  </div>

  <div class="buttons">
    <button id="b-start" class="btn green" type="button"><span class="lbl">Larm utlöst</span><span class="sub" id="s-start"></span></button>
    <button id="b-guard" class="btn" type="button"><span class="lbl">Väktare på plats</span><span class="sub" id="s-guard"></span></button>
    <button id="b-rtj" class="btn" type="button"><span class="lbl">RTJ kommer</span><span class="sub" id="s-rtj"></span></button>
    <button id="b-evac" class="btn" type="button"><span class="lbl">Utrymning klar</span><span class="sub" id="s-evac"></span></button>
    <div class="pair">
      <button id="b-oth1" class="btn other" type="button"><span class="lbl">Övrig händelse 1</span><span class="sub" id="s-oth1"></span></button>
      <button id="b-oth2" class="btn other" type="button"><span class="lbl">Övrig händelse 2</span><span class="sub" id="s-oth2"></span></button>
    </div>
    <button id="b-end" class="btn red" type="button"><span class="lbl">Övning avslutad</span><span class="sub" id="s-end"></span></button>
  </div>

  <div class="export-wrap">
    <button id="export" class="btn export" type="button" disabled>Exportera tider (mail)</button>
    <button id="copy" class="textbtn" type="button" disabled>Kopiera tider</button>
    <p id="note" class="note" hidden></p>
    <textarea id="fallback" class="fallback" readonly hidden aria-label="Tider att kopiera"></textarea>
  </div>

  <div class="reset-wrap">
    <button id="reset" class="textbtn reset" type="button">Nollställ</button>
  </div>
</main>

<script>
(function () {
  var KEY = 'utrymningstimer.v1';
  var STEPS = [
    { k: 'start', name: 'Larm utlöst' },
    { k: 'guard', name: 'Väktare på plats' },
    { k: 'rtj', name: 'RTJ kommer' },
    { k: 'evac', name: 'Utrymning klar' },
    { k: 'oth1', name: 'Övrig händelse 1' },
    { k: 'oth2', name: 'Övrig händelse 2' },
    { k: 'end', name: 'Övning avslutad' }
  ];
  var SUBJECT = 'Utrymningsövning – tider';

  function empty() { return { start: null, guard: null, rtj: null, evac: null, oth1: null, oth2: null, end: null }; }
  var st = empty();

  // Läs sparade tider. Tider som redan finns i minnet behålls alltid om lagringen saknar dem.
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { return; }
    if (!raw) return;
    var o;
    try { o = JSON.parse(raw); } catch (e) { return; }
    if (!o || typeof o !== 'object') return;
    STEPS.forEach(function (s) {
      if (typeof o[s.k] === 'number' && isFinite(o[s.k])) st[s.k] = o[s.k];
    });
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
  }

  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtEl(ms) {
    if (!(ms > 0)) ms = 0;
    var cs = Math.floor(ms / 10);
    var c = cs % 100;
    var s = Math.floor(cs / 100) % 60;
    var m = Math.floor(cs / 6000) % 60;
    var h = Math.floor(cs / 360000);
    return (h ? h + ':' + p2(m) : p2(m)) + ':' + p2(s) + '.' + p2(c);
  }
  function fmtClock(t) {
    var d = new Date(t);
    return p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
  }
  function fmtDate(t) {
    var d = new Date(t);
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  }
  function running() { return !!st.start && !st.end; }

  var $ = function (id) { return document.getElementById(id); };
  var timeEl = $('time'), capEl = $('cap'), statusEl = $('status'), dateEl = $('date');
  var exportBtn = $('export'), copyBtn = $('copy'), noteEl = $('note'), fbEl = $('fallback'), resetBtn = $('reset');

  function renderClock() {
    var txt = '00:00.00';
    if (st.start) txt = fmtEl((st.end || Date.now()) - st.start);
    if (timeEl.textContent !== txt) timeEl.textContent = txt;
    timeEl.classList.toggle('long', txt.length > 8);
  }

  function render() {
    renderClock();
    var r = running();
    statusEl.className = 'pill' + (r ? ' running' : st.end ? ' ended' : '');
    statusEl.textContent = r ? 'Pågår' : st.end ? 'Avslutad' : 'Redo';
    dateEl.textContent = st.start ? fmtDate(st.start) : '';
    capEl.textContent = st.end ? 'Total tid' : 'Tid sedan larm';

    STEPS.forEach(function (s) {
      var b = $('b-' + s.k), sub = $('s-' + s.k), t = st[s.k];
      var enabled;
      if (s.k === 'start') enabled = !st.start;
      else enabled = r && !t;
      b.disabled = !enabled;
      b.classList.toggle('done', !!t);
      var html = '';
      if (t) {
        if (s.k === 'start') html = '<span class="el">' + fmtClock(t) + '</span><span class="tod">start</span>';
        else html = '<span class="el">' + fmtEl(t - st.start) + '</span><span class="tod">' + fmtClock(t) + '</span>';
      } else if (s.k === 'start' && enabled) {
        html = 'Starta';
      }
      if (sub.innerHTML !== html) sub.innerHTML = html;
    });

    exportBtn.disabled = !st.start;
    copyBtn.disabled = !st.start;
    wake();
  }

  var raf = 0;
  function tick() {
    renderClock();
    raf = running() ? requestAnimationFrame(tick) : 0;
  }
  function loop() {
    if (running() && !raf) raf = requestAnimationFrame(tick);
  }

  function press(k) {
    var now = Date.now();
    load();
    if (k === 'start') {
      if (st.start) return render();
      st.start = now;
    } else {
      if (!st.start || st.end || st[k]) return render();
      st[k] = now;
    }
    save();
    try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {}
    render();
    loop();
  }
  STEPS.forEach(function (s) {
    $('b-' + s.k).addEventListener('click', function () { press(s.k); });
  });

  // Skärmlås (Wake Lock)
  var lock = null, pending = false;
  function wake() {
    if (!('wakeLock' in navigator)) return;
    if (running() && document.visibilityState === 'visible') {
      if (lock || pending) return;
      pending = true;
      navigator.wakeLock.request('screen').then(function (l) {
        lock = l;
        pending = false;
        l.addEventListener('release', function () { if (lock === l) lock = null; });
        if (!running()) release();
      }).catch(function () { pending = false; lock = null; });
    } else if (!running()) {
      release();
    }
  }
  function release() {
    if (!lock) return;
    var l = lock; lock = null;
    try { l.release().catch(function () {}); } catch (e) {}
  }

  // Export
  function buildText() {
    var L = [];
    L.push('Utrymningsövning ' + fmtDate(st.start));
    L.push('');
    L.push('Larm utlöst: ' + fmtClock(st.start));
    STEPS.slice(1).forEach(function (s) {
      var t = st[s.k];
      L.push(s.name + ': ' + (t ? fmtClock(t) + ' (' + fmtEl(t - st.start) + ' efter larm)' : 'ej registrerad'));
    });
    L.push('');
    L.push('Total tid: ' + fmtEl((st.end || Date.now()) - st.start) + (st.end ? '' : ' (pågår)'));
    return L.join('\r\n');
  }

  var noteTimer = 0;
  function showNote(text, ms) {
    noteEl.textContent = text;
    noteEl.hidden = false;
    clearTimeout(noteTimer);
    if (ms) noteTimer = setTimeout(function () { noteEl.hidden = true; }, ms);
  }

  exportBtn.addEventListener('click', function () {
    load();
    if (!st.start) return;
    var href = 'mailto:?subject=' + encodeURIComponent(SUBJECT) + '&body=' + encodeURIComponent(buildText());
    var a = document.createElement('a');
    a.href = href;
    a.target = '_top';
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    try { a.click(); } catch (e) {}
    setTimeout(function () { a.remove(); }, 0);
    showNote('Öppnas inte mailappen? Tryck på Kopiera tider och klistra in i ett mail.', 8000);
  });

  var copyTimer = 0;
  function copied() {
    copyBtn.textContent = 'Kopierad ✓';
    copyBtn.classList.add('ok');
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function () {
      copyBtn.textContent = 'Kopiera tider';
      copyBtn.classList.remove('ok');
    }, 2000);
  }
  function fallbackCopy(text) {
    fbEl.value = text.replace(/\r\n/g, '\n');
    fbEl.hidden = false;
    fbEl.focus();
    fbEl.setSelectionRange(0, fbEl.value.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (ok) copied();
    else showNote('Markera texten nedan och välj Kopiera.', 0);
  }
  copyBtn.addEventListener('click', function () {
    load();
    if (!st.start) return;
    var text = buildText();
    try {
      navigator.clipboard.writeText(text).then(function () {
        fbEl.hidden = true;
        copied();
      }).catch(function () { fallbackCopy(text); });
    } catch (e) {
      fallbackCopy(text);
    }
  });

  // Nollställ i två steg
  var armTimer = 0;
  function disarm() {
    clearTimeout(armTimer);
    armTimer = 0;
    resetBtn.textContent = 'Nollställ';
    resetBtn.classList.remove('armed');
  }
  resetBtn.addEventListener('click', function () {
    if (armTimer) {
      disarm();
      st = empty();
      try { localStorage.removeItem(KEY); } catch (e) {}
      fbEl.hidden = true;
      fbEl.value = '';
      noteEl.hidden = true;
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      render();
    } else {
      resetBtn.textContent = 'Tryck igen för att radera alla tider';
      resetBtn.classList.add('armed');
      armTimer = setTimeout(disarm, 4000);
    }
  });

  function refresh() { load(); render(); loop(); }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') refresh();
  });
  window.addEventListener('pageshow', refresh);
  window.addEventListener('focus', refresh);
  window.addEventListener('storage', function (e) { if (e.key === KEY) refresh(); });

  refresh();
})();
</script>
</body>
</html>
